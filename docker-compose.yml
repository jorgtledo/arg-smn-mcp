services:
  mcp-smn:
    build:
      context: .
      dockerfile: Dockerfile
    image: arg-smn-mcp:latest
    container_name: arg-smn-mcp
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    init: true
    # Chromium en Docker Desktop (Windows/Mac) crashea con el shm de 64MB.
    shm_size: "1gb"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
